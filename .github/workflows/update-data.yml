name: Auto update Ronaldo match data

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 09:00（北京时间）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update data
        run: python docs-deploy/scripts/update_matches.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-deploy/data/matches.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: auto-update Ronaldo match data"
            git push
          fi

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload site
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-deploy

      - name: Deploy
        if: always()
        uses: actions/deploy-pages@v4
